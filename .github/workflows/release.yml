name: Release Port Menu

on:
  push:
    branches: [main]
    paths:
      - 'Porter/**'
      - 'PorterTests/**'
      - 'Porter.xcodeproj/**'
      - 'scripts/**'
      - 'packaging/Info.plist'
      - '.github/workflows/release.yml'
  workflow_dispatch:

# Only trusted main commits receive signing credentials; never pull requests.
permissions:
  contents: read
concurrency:
  group: port-menu-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'kuricialm/port-menu' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      DEVELOPER_ID_APP: ${{ vars.DEVELOPER_ID_APP }}
      OUTPUT_DIR: ${{ runner.temp }}/portmenu-release
      PACKAGES_DIR: ${{ runner.temp }}/portmenu-packages
      SPARKLE_KEY_FILE: ${{ runner.temp }}/portmenu-sparkle.key
      NOTARY_API_KEY_FILE: ${{ runner.temp }}/portmenu-notary.p8
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      # Team API keys need an issuer. Individual API keys must omit it (Xcode 26+).
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check one-time release setup
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          NOTARY_KEY: ${{ secrets.NOTARY_API_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          required = ['TEAM_ID','DEVELOPER_ID_APP','CERTIFICATE','CERTIFICATE_PASSWORD',
                      'SPARKLE_KEY','NOTARY_KEY','NOTARY_KEY_ID']
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Release setup incomplete: '+', '.join(missing)+'. See docs/releasing.md.')
          PY
      - name: Validate and test
        run: |
          python3 scripts/test-release-metadata.py
          xcodebuild test -project Porter.xcodeproj -scheme Porter \
            -destination "platform=macOS,arch=$(uname -m)" -only-testing:PorterTests \
            -derivedDataPath "$RUNNER_TEMP/portmenu-tests" \
            -clonedSourcePackagesDirPath "$PACKAGES_DIR" -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO
      - name: Import signing material into temporary storage
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          NOTARY_KEY: ${{ secrets.NOTARY_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, os, pathlib, secrets
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          (root/'portmenu-certificate.p12').write_bytes(base64.b64decode(os.environ['CERTIFICATE'], validate=True))
          pathlib.Path(os.environ['SPARKLE_KEY_FILE']).write_text(os.environ['SPARKLE_KEY'])
          pathlib.Path(os.environ['NOTARY_API_KEY_FILE']).write_text(os.environ['NOTARY_KEY'])
          (root/'portmenu-keychain-password').write_text(secrets.token_hex(32))
          PY
          KEYCHAIN="$RUNNER_TEMP/portmenu-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(cat "$RUNNER_TEMP/portmenu-keychain-password")
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/portmenu-certificate.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          EXPECTED_KEY=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' packaging/Info.plist)
          test "$(xcrun swift scripts/sparkle-public-key.swift "$SPARKLE_KEY_FILE")" = "$EXPECTED_KEY"
      - name: Choose the next version and build
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(python3 scripts/release-github.py check-source)" = skip ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'skip=false' >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/portmenu-previous"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/portmenu-releases.json"
          COUNT=$(python3 -c 'import json,sys; print(sum(not r["isDraft"] and not r["isPrerelease"] for r in json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/portmenu-releases.json")
          if [ "$COUNT" != 0 ]; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir "$RUNNER_TEMP/portmenu-previous"
            "$PACKAGES_DIR/artifacts/sparkle/Sparkle/bin/sign_update" --ed-key-file "$SPARKLE_KEY_FILE" \
              --verify "$RUNNER_TEMP/portmenu-previous/appcast.xml"
            python3 scripts/release-metadata.py next "$RUNNER_TEMP/portmenu-previous/appcast.xml" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/release-metadata.py next >> "$GITHUB_OUTPUT"
          fi
      - name: Build, notarize, and sign the update feed
        if: steps.version.outputs.skip != 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUILD: ${{ steps.version.outputs.build }}
        run: ./scripts/release-macos.sh
      - name: Publish verified artifacts together
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: python3 scripts/release-github.py publish "$VERSION" "$BUILD"
      - name: Keep debug symbols for crash diagnosis
        if: success() && steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PortMenu-symbols-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/portmenu-release/dSYMs
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/portmenu-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/portmenu-certificate.p12" "$RUNNER_TEMP/portmenu-keychain-password" \
            "$SPARKLE_KEY_FILE" "$NOTARY_API_KEY_FILE"
